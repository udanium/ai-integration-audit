/* ——— Editorial visual system ——— */

/* ——— Signature interactive dimension map ——— */

function getLevel(score) {
  if (score < 20) return { level: "Stalled", hex: "#725c76", desc: "2026 didn’t gain much traction. The good news: you can reset with clear intent for 2027." };
  if (score < 40) return { level: "Scattered", hex: "#796885", desc: "Lots of activity, little coherence. It’s time to focus and connect the dots." };
  if (score < 60) return { level: "Emerging", hex: "#036d7d", desc: "Real foundations are forming. Some areas need deliberate attention to scale." };
  if (score < 80) return { level: "Integrated", hex: "#008f9a", desc: "AI is meaningfully woven into your practice. Sharpen the gaps to lead." };
  return { level: "Leading", hex: "#003142", desc: "Your team is setting the pace. Now the work is sustaining and sharing it." };
}

function readSavedAnswers() {
  try {

    if (!saved || typeof saved !== 'object') return {};

    return Object.fromEntries(Object.entries(saved).filter(([k,v]) => valid.has(k) && Number.isInteger(v) && v>=1 && v<=5));
  } catch { return {}; }
}
function saveAnswers() {

// The six dimensions are an interactive diagnostic map, not a benchmark.
// Highest-score dimension alone gets teal; every other dimension uses plum/violet.
// Tie-break: the last tied dimension in survey order (matches ranked report ordering).
const HIGHEST_TEAL = "#007F8E";
const OTHER_PLUM = "#796885";
const highestDimensionIndex = scores => scores.lastIndexOf(Math.max(...scores));
const dimensionAccent = (index, scores) => index === highestDimensionIndex(scores) ? HIGHEST_TEAL : OTHER_PLUM;

function diagnosticMap(scores) {
  const w = 620, h = 550, cx = 310, cy = 269, radius = 172;
  const highestIndex = highestDimensionIndex(scores);
  const point = (i, pct) => {
    const angle = i * 2 * Math.PI / 6 - Math.PI / 2;
    const r = radius * pct / 100;
    return {x: cx + Math.cos(angle)*r, y: cy + Math.sin(angle)*r};
  };
  const poly = (pct) => pct.map((v,i) => {
    const p = point(i,v); return `${p.x.toFixed(1)},${p.y.toFixed(1)}`;
  }).join(' ');
  const wrap = (title) => title.replace(/&/g,'&amp;');
  let svg = `<svg class="diagnostic-map" viewBox="0 0 ${w} ${h}" role="group" aria-label="Interactive map of six AI integration dimensions. Choose a labeled point to explore its interpretation.">`;
  [25,50,75,100].forEach(n => svg += `<polygon class="map-ring" points="${poly(DIMS.map(()=>n))}"/>`);
  DIMS.forEach((d,i) => {const p=point(i,100);svg+=`<line class="map-spoke" x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}"/>`;});
  svg += `<polygon class="map-shape" points="${poly(scores)}"/>`;
  // The active path simply guides attention. It does not imply causality between dimensions.
  const focus = point(state.activeDimension,scores[state.activeDimension]);
  svg += `<line id="map-focus-beam" class="map-focus-beam" x1="${cx}" y1="${cy}" x2="${focus.x}" y2="${focus.y}"/>
    <line id="map-focus-path" class="map-focus-path" x1="${cx}" y1="${cy}" x2="${focus.x}" y2="${focus.y}"/>
    <circle id="map-focus-glow" class="map-focus-glow" cx="${focus.x}" cy="${focus.y}" r="27"/>`;
  svg += `<circle cx="${cx}" cy="${cy}" r="29" fill="#f7f6ee" stroke="#c9cbbb"/><text x="${cx}" y="${cy-3}" text-anchor="middle" class="map-center-top">YOUR</text><text x="${cx}" y="${cy+10}" text-anchor="middle" class="map-center-bottom">TEAM</text>`;
  DIMS.forEach((d,i) => {
    const p=point(i,scores[i]), label=point(i,117);
    const selected=i===state.activeDimension;
    const lines = d.title.split(' & ');
    const short = lines.length>1 ? [lines[0]+' &',lines.slice(1).join(' & ')] : [d.title];
    svg += `<g style="--node-accent:${dimensionAccent(i,scores)}" class="map-node ${i===highestIndex?'is-highest':''} ${selected?'is-active':'is-dimmed'}" data-dimension="${i}" role="button" tabindex="0" aria-pressed="${selected}" aria-label="${wrap(d.title)}, ${round(scores[i])} percent. Explore this dimension.">
      <circle class="map-target" cx="${p.x}" cy="${p.y}" r="27"/>
      <circle class="map-halo" cx="${p.x}" cy="${p.y}" r="18"/>
      <circle class="map-dot" cx="${p.x}" cy="${p.y}" r="8"/>
      <text class="map-label" x="${label.x}" y="${label.y-(short.length>1?9:0)}" text-anchor="middle">${short.map((line,j)=>`<tspan x="${label.x}" dy="${j?16:0}">${wrap(line)}</tspan>`).join('')}<tspan class="map-label-score" x="${label.x}" dy="19">${round(scores[i])}%</tspan></text>
    </g>`;
  });
  return svg + `</svg>`;
}

function dimensionDetail(index) {
  const d = DIMS[index], score = dimScore(d), lvl = getLevel(score);
  const rank = DIMS.map((item,i)=>({i,score:dimScore(item)})).sort((a,b)=>a.score-b.score);
  const position = rank.findIndex(item=>item.i===index);
  const framing = position===0 ? 'Lowest-scoring area' : position===5 ? 'Highest-scoring area' : 'Dimension '+index+1;
  return `<div class="detail-overline">${framing} <span>· ${lvl.level}</span></div>
    <div class="detail-score">${round(score)}<span>%</span></div>
    <h3>${d.title}</h3><p class="detail-sub">${d.subtitle}</p>
    <p class="detail-reading">${GUIDANCE[d.id].priority}</p>
    <div class="detail-prompt"><span>QUESTION TO TAKE BACK</span><p>${FOLLOWUP_QUESTIONS[d.id]}</p></div>`;
}

function selectDimension(index) {
  if(state.stage!=='results' || index<0 || index>=DIMS.length)return;
  state.activeDimension=index;
  const detail=app.querySelector('#dimension-detail');
  const aside=app.querySelector('.profile-aside');
  const layout=app.querySelector('.profile-layout');
  const scores=DIMS.map(dimScore);
  if(layout) layout.classList.toggle('is-highest-focus',index===highestDimensionIndex(scores));
  if(aside) aside.classList.toggle('is-highest',index===highestDimensionIndex(scores));
  if(aside) aside.classList.remove('detail-switch');
  if(detail) detail.innerHTML=dimensionDetail(index);
  if(aside) { void aside.offsetWidth; aside.classList.add('detail-switch'); }
  const d=DIMS[index], score=dimScore(d);
  const angle=index*2*Math.PI/6-Math.PI/2, r=172*score/100;
  const x=310+Math.cos(angle)*r, y=269+Math.sin(angle)*r;
  for(const id of ['map-focus-beam','map-focus-path']) {
    const line=app.querySelector('#'+id);
    if(line){line.setAttribute('x2',x.toFixed(2));line.setAttribute('y2',y.toFixed(2));}
  }
  const glow=app.querySelector('#map-focus-glow');
  if(glow){glow.setAttribute('cx',x.toFixed(2));glow.setAttribute('cy',y.toFixed(2));}
  app.querySelectorAll('[data-dimension]').forEach(el=>{
    const on=Number(el.dataset.dimension)===index;
    el.classList.toggle('is-active',on);
    if(el.classList.contains('map-node')) el.classList.toggle('is-dimmed',!on);
    el.setAttribute('aria-pressed',String(on));
  });
}

    <section class="advisory-section" aria-labelledby="advisory-heading">
      <div class="advisory-kicker">FROM DIAGNOSIS TO DELIBERATE ACTION</div><h2 id="advisory-heading">Need a thoughtful outside perspective?</h2>
      <p class="advisory-intro">I'm Uday, AI &amp; UX strategist in Silicon Valley. I help design and product leaders untangle the organizational, human, and craft questions behind AI adoption—then turn them into practical moves.</p>
      <p>Based on your answers, these are the kinds of working sessions I'd explore with your team:</p>
      <div class="engagement-list">${offers}</div>
      <div class="btns advisory-actions"><a class="btn primary-arrow" href="${mailto}">Share your results with me</a><a class="btn outline" href="${CONSULTANT.site}" target="_blank" rel="noopener">Explore my work</a><a class="btn outline" href="${CONSULTANT.linkedin}" target="_blank" rel="noopener">Connect on LinkedIn</a></div>
      <p class="small no-print email-privacy">The email opens as a draft with your six scores. Nothing is sent unless you choose to send it.</p>
      ${formHtml}
    </section>
    <div class="result-tools no-print"><button class="btn outline" data-action="review">Review answers</button><button class="btn outline" data-action="print">Print / save as PDF</button><button class="btn outline" data-action="restart">Start over</button></div>
  `;
}

/* =========================================================
   RENDER & EVENTS
   ========================================================= */
function render() {
  if (state.stage === "intro") app.innerHTML = introView();
  else if (state.stage === "questions") app.innerHTML = questionsView();
  else {
    app.innerHTML = resultsView();
    const form = document.getElementById("lead-form");
    if (form) form.addEventListener("submit", submitLead);
  }
}

app.addEventListener("click", (e) => {
  const dim = e.target.closest('[data-dimension]');
  if(dim) { selectDimension(Number(dim.dataset.dimension)); return; }
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  switch (el.dataset.action) {
    case "start": go("questions", 0); break;
    case "prev": state.current === 0 ? go("intro") : go("questions", state.current - 1); break;
    case "next": go("questions", state.current + 1); break;
    case "results": go("results"); break;
    case "review": go("questions", 0); break;
    case "print": window.print(); break;
    case "restart": state.scores = {}; saveAnswers(); state.activeDimension = null; go("intro", 0); break;
  }
});

app.addEventListener('keydown', (e) => {
  const dim=e.target.closest('svg [data-dimension]');
  if(dim && (e.key==='Enter'||e.key===' ')) {
    e.preventDefault(); selectDimension(Number(dim.dataset.dimension));
  }
});

app.addEventListener("change", (e) => {
  const input = e.target;
  if (input.type !== "radio") return;
  state.scores[input.name] = parseInt(input.value, 10);
  saveAnswers();
  input.closest("fieldset").querySelectorAll(".opt").forEach((l) =>
    l.classList.toggle("sel", l.contains(input)));
  const btn = app.querySelector('[data-action="next"], [data-action="results"]');
  if (btn) btn.disabled = !dimDone(DIMS[state.current]);
});

async function submitLead(e) {
  e.preventDefault();
  const form = e.target;
  const msg = document.getElementById("form-msg");
  const btn = form.querySelector("button[type=submit]");
  const fd = new FormData(form);
  const payload = {
    name: fd.get("name"),
    email: fd.get("email"),
    organization: fd.get("organization") || "",
    overall: state.results.overall + "%",
    level: state.results.level,
    ...Object.fromEntries(Object.entries(state.results.dimensions).map(([k, v]) => [k, v + "%"]))
  };
  btn.disabled = true;
  msg.textContent = "Sending…";
  msg.style.color = "var(--muted)";
  try {
    const res = await fetch(FORM_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error();
    msg.textContent = "Thanks! I’ll be in touch soon. 🙏🏽";
    msg.style.color = "#166534";
    form.querySelectorAll("input").forEach((i) => (i.disabled = true));
  } catch {
    msg.textContent = "Something went wrong. Please use the email button above instead.";
    msg.style.color = "#dc2626";
    btn.disabled = false;
  }
}

render();
</script>
</body>
</html>
